# Caspian fewshot split — Tahoe-aligned. 5 held-out cell lines; for them a
# shared set of whole drugs (all doses) is withheld as `test`. Non-test
# treatments stay in train as the observed query panel. Generated by
# scripts/data_prep/make_caspian_split.py.
# seed=0, test_frac=0.65 (1158 of 1782 drugs), val_frac=0.05 (89 drugs). The fewshot loader uses `test`;
# `val` is recorded for parity (stays in train, unused by the loader).

[datasets]
caspian = "/nvme-shared/datasets/caspian/state_input_log1p/"

[training]
caspian = "train"

[zeroshot]

